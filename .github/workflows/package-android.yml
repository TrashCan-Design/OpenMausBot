name: Package Android

on:
  push:
    branches: [codex/windows-installer]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit/tag/branch to build (defaults to the branch this is run from)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: openbot-android-release
  cancel-in-progress: false

jobs:
  build:
    name: Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true
      - name: Run unit tests
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew :core:test :app:testDebugUnitTest
      - name: Assemble APKs
        run: |
          cd android
          ./gradlew :app:assemblePreview :app:assembleRelease
      - name: Prepare Android release artifacts
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p release-android
          PREVIEW_APK=$(find android/app/build/outputs/apk/preview -name "*.apk" | head -n 1)
          RELEASE_APK=$(find android/app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -n "$PREVIEW_APK" ] && [ -f "$PREVIEW_APK" ]; then
            cp "$PREVIEW_APK" "release-android/OpenBot-${VERSION}-preview.apk"
          fi
          if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
            cp "$RELEASE_APK" "release-android/OpenBot-${VERSION}-$(basename "$RELEASE_APK")"
          fi
          cd release-android
          sha256sum *.apk > SHA256SUMS.txt
          echo "${{ github.sha }}" > SOURCE_COMMIT.txt
          ls -la
      - name: Upload Android APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-apk
          path: |
            release-android/*.apk
            release-android/SHA256SUMS.txt
            release-android/SOURCE_COMMIT.txt
          if-no-files-found: error
          retention-days: 14
      - name: Attach APKs to GitHub Release if present
        if: github.event_name == 'push' && github.ref == 'refs/heads/codex/windows-installer' && github.repository == 'TrashCan-Design/OpenBot'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-android/*.apk release-android/SHA256SUMS.txt --repo "${{ github.repository }}" --clobber || true
          fi
