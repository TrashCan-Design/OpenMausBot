name: OpenBot Windows release

on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: openbot-windows-release
  cancel-in-progress: false

jobs:
  package:
    if: github.ref == 'refs/heads/main' && github.repository == 'TrashCan-Design/OpenBot'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Check release version and repository
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "TrashCan-Design/OpenBot" || {
            echo "::error::Rename the fork to TrashCan-Design/OpenBot before publishing"; exit 1; }
          current=$(node -p "require('./package.json').version")
          [[ "$current" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::Expected a stable semantic version"; exit 1; }
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            previous=$(git show HEAD^:package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
            if [ "$previous" = "$current" ]; then
              echo "Version is unchanged; no installer needed"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          if gh release view "v$current" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$current already exists; bump the version instead"; exit 1
          fi
          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "value=$current" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ff378ebe6b225b0680b81c1ad4498ae0d1d3a5e3 # v6.0.10
        if: steps.version.outputs.publish == 'true'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: steps.version.outputs.publish == 'true'
        with:
          node-version: 24
          cache: pnpm
      - if: steps.version.outputs.publish == 'true'
        run: pnpm install --frozen-lockfile
      - name: Verify Windows shared desktop and release safety
        if: steps.version.outputs.publish == 'true'
        run: pnpm exec vitest run server/shared-vps-gateway.test.ts server/shared-vps-seat.test.ts server/shared-vps-host.test.ts server/shared-vps-proxy.test.ts server/phone-secret.test.ts scripts/testing/index-route-ratchet.test.ts scripts/windows-release.test.ts scripts/package-win-workflow.test.ts
      - if: steps.version.outputs.publish == 'true'
        run: pnpm package:win
        env:
          NODE_OPTIONS: --max-old-space-size=6144
      - name: Verify installer and update feed
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          res=release/win-unpacked/resources
          test -s "release/OpenBot-$VERSION-setup.exe"
          test -s "release/OpenBot-$VERSION-setup.exe.blockmap"
          test -s release/latest.yml
          test -s "$res/server/index.js"
          test -s "$res/server/desktop-entry.mjs"
          test -s "$res/ui/index.html"
          test -s "$res/app-update.yml"
          grep -Fxq 'owner: TrashCan-Design' "$res/app-update.yml"
          grep -Fxq 'repo: OpenBot' "$res/app-update.yml"
          node scripts/windows-release.mjs validate release
      - name: Verify packaged browser and server
        if: steps.version.outputs.publish == 'true'
        shell: bash
        run: |
          node scripts/smoke-browser-bundle.mjs --resources "$GITHUB_WORKSPACE/release/win-unpacked/resources"
          OMB_SMOKE_DIST="$GITHUB_WORKSPACE/release/win-unpacked/resources/server" node scripts/smoke-packaged-server.mjs --browser-bundle "$GITHUB_WORKSPACE/release/win-unpacked/resources/browser-engine"
      - name: Publish updater-compatible GitHub Release
        if: steps.version.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          set -euo pipefail
          cd release
          sha256sum "OpenBot-$VERSION-setup.exe" > SHA256SUMS.txt
          git rev-parse HEAD > SOURCE_COMMIT.txt
          cd ..
          node scripts/windows-release.mjs publish release
